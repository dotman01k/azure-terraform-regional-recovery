name: Protected recovery operation
'on':
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options:
        - observe
        - stop-primary
        - authorize
        - promote
        - probe
        - adopted
        - routing-evidence
        default: observe
        required: true
      incident:
        type: string
        required: false
      confirm_target:
        type: string
        required: false
      ack_possible_data_loss:
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: dr-controlplane
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on:
    - self-hosted
    - linux
    - dr-operator
    environment: dr-control
    timeout-minutes: 120
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      BACKEND_ACCOUNT: ${{ vars.BACKEND_ACCOUNT }}
      BACKEND_RESOURCE_GROUP: ${{ vars.BACKEND_RESOURCE_GROUP }}
      RECOVERY_MANIFEST_JSON: ${{ vars.RECOVERY_MANIFEST_JSON }}
      PG_ADMIN_GROUP: ${{ vars.PG_ADMIN_GROUP }}
      ACTION: ${{ inputs.action }}
      INCIDENT: ${{ inputs.incident }}
      ACK_LOSS: ${{ inputs.ack_possible_data_loss }}
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: 1.13.0
        terraform_wrapper: false
    - uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Prepare private evidence
      run: 'mkdir -p .run

        umask 077

        python - <<''PYCODE''

        import json,os

        from pathlib import Path

        from recovery.policy import validate_manifest

        m=validate_manifest(json.loads(os.environ[''RECOVERY_MANIFEST_JSON'']))

        Path(''.run/manifest.json'').write_text(json.dumps(m))

        PYCODE'
    - name: Initialize adoption backends when required
      if: inputs.action == 'adopted' || inputs.action == 'routing-evidence'
      run: bash scripts/init-recovery-states.sh
    - name: Run explicit recovery action
      run: "args=(\"$ACTION\" --manifest .run/manifest.json --output .run/evidence.json)\nif [[ \"$ACTION\" != observe ]]; then args+=(--execute --confirm-target \"$CONFIRM_TARGET\"); fi\nif [[ \"$ACTION\" == authorize ]]; then\n  args+=(--incident \"$INCIDENT\")\n  [[ \"$ACK_LOSS\" == true ]] && args+=(--ack-possible-data-loss)\nfi\npython -m recovery.live \"${args[@]}\""
