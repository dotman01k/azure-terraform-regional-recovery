name: Protected Terraform stage
'on':
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options:
        - network
        - primary
        - replica
        - replica-detach
        - recovered
        - routing
        required: true
      operation:
        type: choice
        options:
        - plan
        - apply
        default: plan
        required: true
      confirm_target:
        type: string
        required: false
        description: Exact promoted PostgreSQL resource ID for recovery routing
permissions:
  contents: read
  id-token: write
concurrency:
  group: dr-controlplane
  cancel-in-progress: false
jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on:
    - self-hosted
    - linux
    - dr-operator
    environment: dr-control
    timeout-minutes: 120
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      BACKEND_ACCOUNT: ${{ vars.BACKEND_ACCOUNT }}
      BACKEND_RESOURCE_GROUP: ${{ vars.BACKEND_RESOURCE_GROUP }}
      RECOVERY_MANIFEST_JSON: ${{ vars.RECOVERY_MANIFEST_JSON }}
      PG_ADMIN_GROUP: ${{ vars.PG_ADMIN_GROUP }}
      STACK: ${{ inputs.stack }}
      OPERATION: ${{ inputs.operation }}
      CONFIRM_STACK: ${{ inputs.operation == 'apply' && inputs.stack || '' }}
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      TFVARS_JSON: ${{ vars[format('{0}_TFVARS_JSON', inputs.stack == 'replica-detach' && 'replica_detach' || inputs.stack)] }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: 1.13.0
        terraform_wrapper: false
    - uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Plan, inspect and optionally apply exact saved plan
      run: python -m recovery.locked_stage "$STACK" "$OPERATION"
